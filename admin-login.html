<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | TrekExplorer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.55)
                ),
                url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b");

            background-size: cover;
            background-position: center;
        }

        .login-box {
            width: 400px;
            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            color: #2e8b57;
            margin: 10px 0;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #2e8b57;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #247447;
        }

        #error {
            text-align: center;
            color: red;
            margin-top: 15px;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #555;

            text-decoration: none;
        }
    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        🏔️
    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        TrekExplorer Administration
    </p>

    <form id="adminLoginForm">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter admin username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter admin password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="error"></p>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>


<script>

document
    .getElementById("adminLoginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;


        // ADMIN CREDENTIALS

        if (
            username === "admin" &&
            password === "admin123"
        ) {

            localStorage.setItem(
                "adminLoggedIn",
                "true"
            );

            window.location.href =
                "admin.html";

        } else {

            document.getElementById("error").textContent =
                "❌ Invalid username or password.";

        }

    });

</script>

</body>

</html>
