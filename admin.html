<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | TrekExplorer</title>

<style>
  :root {
    --green: #2E8B57;
    --green-dark: #247447;
    --green-deep: #1f3d2b;
    --green-soft: #eef8f2;
    --bg: #f5f7f5;
    --text: #333;
    --muted: #777;
    --line: #e8ece9;
    --red: #dc3545;
    --shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
  body.locked { visibility: hidden; }   /* hidden until the admin login is verified */

  /* ================= NAVBAR ================= */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    height: 75px; padding: 0 60px;
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 25px; font-weight: bold; color: var(--green); }
  .admin-pill {
    background: var(--green-soft); color: var(--green); font-size: 12px; font-weight: bold;
    padding: 5px 12px; border-radius: 20px; letter-spacing: .3px;
  }
  .admin-area { display: flex; align-items: center; gap: 16px; }
  .admin-user { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .admin-avatar {
    width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: bold;
  }
  .logout-btn {
    background: #fff; color: var(--red); border: 2px solid var(--red); padding: 8px 18px;
    border-radius: 8px; font-weight: bold; cursor: pointer; transition: .25s;
  }
  .logout-btn:hover { background: var(--red); color: #fff; }

  /* ================= BANNER ================= */
  .banner {
    padding: 46px 60px 100px; color: #fff;
    background:
      linear-gradient(rgba(20, 50, 33, .78), rgba(20, 50, 33, .78)),
      url("img/kaluwaterfall.png") center / cover,
      var(--green-deep);
  }
  .banner-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between;
                  align-items: center; gap: 20px; flex-wrap: wrap; }
  .banner h1 { font-size: 34px; margin-bottom: 8px; }
  .banner p { opacity: .9; font-size: 16px; }
  .refresh-btn {
    background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.55);
    padding: 12px 22px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: .25s;
  }
  .refresh-btn:hover { background: #fff; color: var(--green); }

  /* ================= LAYOUT ================= */
  .container { width: 90%; max-width: 1200px; margin: -62px auto 60px; }

  /* ================= STATS ================= */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 34px; }
  .stat-card {
    background: #fff; border-radius: 16px; padding: 24px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 16px;
  }
  .stat-icon {
    width: 56px; height: 56px; border-radius: 14px; background: var(--green-soft);
    display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0;
  }
  .stat-icon.amber { background: #fff4db; }
  .stat-number { font-size: 28px; font-weight: bold; color: var(--green); line-height: 1.1; }
  .stat-title { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .stat-sub { color: #999; font-size: 12px; margin-top: 2px; }

  /* ================= TABS ================= */
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; border-bottom: 2px solid var(--line); }
  .tab {
    background: none; border: none; padding: 14px 22px; font-size: 16px; font-weight: bold; color: var(--muted);
    cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: .2s;
  }
  .tab:hover { color: var(--green); }
  .tab.active { color: var(--green); border-bottom-color: var(--green); }
  .tab .count {
    display: inline-block; margin-left: 8px; min-width: 24px; padding: 2px 8px; border-radius: 12px;
    background: var(--line); color: #555; font-size: 12px;
  }
  .tab.active .count { background: var(--green); color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ================= TOOLBAR ================= */
  .toolbar { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .toolbar input, .toolbar select {
    height: 46px; padding: 0 16px; border: 1px solid #d5dbd7; border-radius: 10px; font-size: 15px;
    background: #fff; outline: none; transition: .2s;
  }
  .toolbar input { flex: 1; min-width: 220px; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(46,139,87,.12); }
  .result-note { color: var(--muted); font-size: 14px; margin-bottom: 14px; }

  /* ================= BOOKINGS ================= */
  #bookingContainer { display: flex; flex-direction: column; gap: 20px; }
  .booking-admin-card {
    background: #fff; border-radius: 16px; padding: 26px; box-shadow: var(--shadow);
    border-left: 5px solid #b9c4bd;
  }
  .booking-admin-card.s-pending { border-left-color: #e0a526; }
  .booking-admin-card.s-active { border-left-color: #1a73e8; }
  .booking-admin-card.s-done { border-left-color: var(--green); }
  .booking-admin-card.s-cancelled { border-left-color: var(--red); }

  .ba-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  .ba-top h3 { color: var(--green); font-size: 21px; margin-bottom: 8px; }
  .customer { display: flex; flex-wrap: wrap; gap: 6px 20px; color: #666; font-size: 14px; }
  .ba-badge { padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: bold;
              background: #e3f0ff; color: #1a5fb4; white-space: nowrap; }
  .ba-badge.pending { background: #fff4db; color: #a66b00; }
  .ba-badge.done { background: #e4f6ea; color: #1e7a43; }
  .ba-badge.cancelled { background: #fde6e6; color: #b3261e; }

  .ba-details {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px;
    margin: 20px 0; padding: 16px 18px; background: #f7f9f8; border-radius: 12px;
  }
  .ba-details small { display: block; color: #888; font-size: 12px; margin-bottom: 4px; }
  .ba-details strong { font-size: 15px; }

  .ba-controls-title { font-size: 13px; font-weight: bold; color: #555; margin-bottom: 12px; }
  .ba-controls { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr auto; gap: 12px; align-items: end; }
  .ba-controls label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; font-weight: bold; }
  .ba-controls select, .ba-controls input {
    width: 100%; height: 44px; padding: 0 12px; border: 1px solid #d5dbd7; border-radius: 9px;
    font-size: 14px; outline: none; background: #fff; transition: .2s;
  }
  .ba-controls select:focus, .ba-controls input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(46,139,87,.12); }
  .save-btn {
    height: 44px; padding: 0 26px; border: none; border-radius: 9px; background: var(--green);
    color: #fff; font-weight: bold; cursor: pointer; transition: .25s;
  }
  .save-btn:hover { background: var(--green-dark); transform: translateY(-1px); box-shadow: 0 8px 18px rgba(46,139,87,.25); }
  .save-btn:disabled { opacity: .65; cursor: default; transform: none; box-shadow: none; }

  /* ================= MESSAGES ================= */
  #messageContainer { display: flex; flex-direction: column; gap: 20px; }
  .message-card { background: #fff; padding: 26px; border-radius: 16px; box-shadow: var(--shadow); }
  .message-top { display: flex; justify-content: space-between; align-items: center; gap: 14px;
                 border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 18px; }
  .sender { display: flex; align-items: center; gap: 14px; }
  .avatar { width: 52px; height: 52px; background: var(--green); color: #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 21px; font-weight: bold; }
  .sender h3 { margin-bottom: 4px; }
  .email { color: var(--muted); font-size: 14px; }
  .delete-btn { background: #fff; color: var(--red); border: 2px solid var(--red); padding: 8px 16px;
                border-radius: 8px; cursor: pointer; font-weight: bold; transition: .25s; }
  .delete-btn:hover { background: var(--red); color: #fff; }
  .message-content { background: #f7f9f8; padding: 18px; border-radius: 12px; margin-bottom: 14px; }
  .message-content h4 { margin-bottom: 8px; color: var(--green); font-size: 15px; }
  .message-content p { line-height: 1.65; color: #444; }
  .date { color: #888; font-size: 13px; }

  /* ================= STATES ================= */
  .loading, .empty { background: #fff; padding: 50px 20px; text-align: center; border-radius: 16px;
                     color: var(--muted); box-shadow: var(--shadow); }
  .empty h3 { color: #333; margin: 8px 0; }
  .error { background: #ffe9e9; color: #b00020; padding: 22px; border-radius: 12px; line-height: 1.7; }
  .error a { color: var(--green); font-weight: bold; }

  /* ================= TOAST ================= */
  #toast {
    position: fixed; right: 24px; bottom: 24px; z-index: 999; max-width: 340px;
    background: var(--green-deep); color: #fff; padding: 14px 20px; border-radius: 10px; font-size: 15px;
    box-shadow: 0 10px 28px rgba(0,0,0,.25); opacity: 0; transform: translateY(14px);
    pointer-events: none; transition: .3s;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.err { background: #b00020; }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 1000px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .ba-controls { grid-template-columns: 1fr 1fr; }
    .save-btn { grid-column: 1 / -1; }
  }
  @media (max-width: 700px) {
    .navbar { padding: 0 18px; height: 68px; }
    .logo { font-size: 20px; }
    .admin-user span { display: none; }
    .banner { padding: 34px 20px 90px; }
    .banner h1 { font-size: 26px; }
    .container { width: 92%; }
    .stats { grid-template-columns: 1fr; }
    .ba-controls { grid-template-columns: 1fr; }
    .message-top { flex-direction: column; align-items: flex-start; }
    .delete-btn { width: 100%; }
    .tab { padding: 12px 14px; font-size: 15px; }
  }
</style>
</head>

<body class="locked">

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="brand">
    <div class="logo">🏔️ TrekExplorer</div>
    <span class="admin-pill">ADMIN</span>
  </div>
  <div class="admin-area">
    <div class="admin-user">
      <div class="admin-avatar">A</div>
      <span>Admin</span>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- ================= BANNER ================= -->
<header class="banner">
  <div class="banner-inner">
    <div>
      <h1>Admin Dashboard</h1>
      <p>Manage trek bookings, bus pickups and customer messages.</p>
    </div>
    <button class="refresh-btn" onclick="refreshAll()">🔄 Refresh</button>

</header>

<main class="container">

      <div>
        <div class="stat-number" id="pendingCount">0</div>
        <div class="stat-title">Awaiting Confirmation</div>
      </div>

    <div class="stat-card">
      <div class="stat-icon">💰</div>

<div id="toast"></div>


<!-- =========================================
     GENERAL + CONTACT MESSAGES (Spring Boot)
     ========================================= -->
<script>
  const API_URL = "http://localhost:8080/api/contact";

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function showToast(text, isError) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.className = "show" + (isError ? " err" : "");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => { t.className = ""; }, 3000);
  }

  function showTab(name) {
    const isBookings = name === "bookings";
    document.getElementById("tabBookings").classList.toggle("active", isBookings);
    document.getElementById("tabMessages").classList.toggle("active", !isBookings);
    document.getElementById("panelBookings").classList.toggle("active", isBookings);
    document.getElementById("panelMessages").classList.toggle("active", !isBookings);
  }

  function refreshAll() {
    loadMessages();
    showToast("Refreshed. Bookings update live.");
  }

  async function loadMessages() {
    const container = document.getElementById("messageContainer");
    container.innerHTML = `<div class="loading">🔄 Loading messages...</div>`;

    try {
      const response = await fetch(API_URL);
      if (!response.ok) throw new Error("Server returned " + response.status);

      const messages = await response.json();
      console.log("Messages received:", messages);
      displayMessages(messages);

    } catch (error) {
      console.error("Error:", error);
      container.innerHTML = `
        <div class="error">
          ❌ <strong>Could not load messages.</strong><br>
          Make sure your Spring Boot application is running on
          <strong>http://localhost:8080</strong><br>
          Error: ${escapeHtml(error.message)}
        </div>`;
    }
  }

  function displayMessages(messages) {
    const container = document.getElementById("messageContainer");

    document.getElementById("messageCount").textContent = messages.length;
    document.getElementById("messageTabCount").textContent = messages.length;

    const emails = new Set(messages.map(item => item.email).filter(Boolean));
    document.getElementById("visitorCount").textContent = emails.size;

    if (messages.length === 0) {
      container.innerHTML = `
        <div class="empty">📭<h3>No messages yet</h3>
        <p>Contact messages will appear here.</p></div>`;
      return;
    }

    container.innerHTML = messages.map(message => {
      const name = message.name || "Unknown User";
      const email = message.email || "No email";
      const userMessage = message.message || message.messages || "No message";
      const date = message.createdAt || message.created_at || null;
      const firstLetter = name.charAt(0).toUpperCase();

      return `
        <div class="message-card">
          <div class="message-top">
            <div class="sender">
              <div class="avatar">${escapeHtml(firstLetter)}</div>
              <div>
                <h3>${escapeHtml(name)}</h3>
                <div class="email">📧 ${escapeHtml(email)}</div>
              </div>
            </div>
            <button class="delete-btn" onclick="deleteMessage(${Number(message.id)})">🗑️ Delete</button>
          </div>
          <div class="message-content">
            <h4>💬 Message</h4>
            <p>${escapeHtml(userMessage)}</p>
          </div>
          <div class="date">📅 ${formatDate(date)}</div>
        </div>`;
    }).join("");
  }

  async function deleteMessage(id) {
    if (!confirm("Are you sure you want to delete this message?")) return;

    try {
      const response = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
      if (!response.ok) throw new Error("Delete failed");
      showToast("Message deleted.");
      loadMessages();
    } catch (error) {
      console.error(error);
      showToast("Could not delete the message.", true);
    }
  }

  function formatDate(date) {
    if (!date) return "Date unavailable";
    const parsedDate = new Date(date);
    if (isNaN(parsedDate.getTime())) return "Date unavailable";
    return parsedDate.toLocaleString();
  }

  function logout() {
    if (window.adminLogout) window.adminLogout();
    else window.location.href = "admin-login.html";
  }

  // loadMessages() is called after the admin login is verified (see the module script below)
</script>


<!-- =========================================
     BOOKINGS (Firebase): status + bus details
     ========================================= -->
<script type="module">
import { auth, db } from "./js/firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { collection, onSnapshot, doc, updateDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Must match the admin email in admin-login.html, Firebase Console and your Firestore rules
const ADMIN_EMAIL = "admin@trekexplorer.com";

window.adminLogout = async () => {
  await signOut(auth);
  window.location.href = "admin-login.html";
};

const container = document.getElementById("bookingContainer");
const searchBox = document.getElementById("searchBox");
const statusFilter = document.getElementById("statusFilter");
const resultNote = document.getElementById("resultNote");

const STATUS_OPTIONS = [
  ["pending",        "Booking Received"],
  ["confirmed",      "Confirmed"],
  ["bus_assigned",   "Bus Assigned"],
  ["bus_on_the_way", "Bus On The Way"],
  ["reached",        "Bus Reached Pickup"],
  ["completed",      "Completed"],
  ["cancelled",      "Cancelled"],
];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const fmtDate = (d) => {
  if (!d) return "-";
  const dt = new Date(d + "T00:00:00");
  return isNaN(dt) ? esc(d) : dt.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
};

function statusClass(status) {
  if (status === "pending") return "s-pending";
  if (status === "reached" || status === "completed") return "s-done";
  if (status === "cancelled") return "s-cancelled";
  return "s-active";
}

function badge(status) {
  const label = (STATUS_OPTIONS.find(o => o[0] === status) || ["", status])[1];
  const cls = status === "pending" ? "pending"
            : (status === "reached" || status === "completed") ? "done"
            : status === "cancelled" ? "cancelled" : "";
  return `<span class="ba-badge ${cls}">${esc(label)}</span>`;
}

function renderBooking(b) {
  const status = b.status || "pending";
  return `
    <div class="booking-admin-card ${statusClass(status)}" data-id="${esc(b.id)}">
      <div class="ba-top">
        <div>
          <h3>${esc(b.trekName)}</h3>
          <div class="customer">
            <span>👤 ${esc(b.fullName)}</span>
            <span>📧 ${esc(b.email)}</span>
            <span>📞 ${esc(b.phone)}</span>
          </div>
        </div>
        ${badge(status)}
      </div>

      <div class="ba-details">
        <div><small>Trek date</small><strong>${fmtDate(b.trekDate)}</strong></div>
        <div><small>People</small><strong>${esc(b.people)}</strong></div>
        <div><small>Total amount</small><strong>₹${Number(b.totalAmount || 0).toLocaleString("en-IN")}</strong></div>
        <div><small>Booking ID</small><strong>${esc(b.id.slice(0, 8))}</strong></div>
        ${b.routePreference ? `<div><small>Route Option</small><strong>${esc(b.routePreference)}</strong></div>` : ""}
        ${b.pickupHub ? `<div><small>Boarding Hub</small><strong>${esc(b.pickupHub)}</strong></div>` : ""}
      </div>

      <div class="ba-controls-title">Update status and pickup details</div>
      <div class="ba-controls">
        <div>
          <label>Status</label>
          <select class="f-status">
            ${STATUS_OPTIONS.map(([v, l]) => `<option value="${v}" ${v === status ? "selected" : ""}>${l}</option>`).join("")}
          </select>
        </div>
        <div><label>Bus number</label><input class="f-bus" type="text" placeholder="e.g. MH 12 AB 1234" value="${esc(b.busNumber || "")}"></div>
        <div><label>Pickup point</label><input class="f-point" type="text" placeholder="e.g. Pune Station" value="${esc(b.pickupPoint || "")}"></div>
        <div><label>Pickup time</label><input class="f-time" type="text" placeholder="e.g. 5:30 AM" value="${esc(b.pickupTime || "")}"></div>
        <button class="save-btn">Update</button>
      </div>
    </div>`;
}

let all = [];

function updateStats() {
  const pending = all.filter(b => (b.status || "pending") === "pending").length;
  const value = all.filter(b => b.status !== "cancelled")
                   .reduce((sum, b) => sum + Number(b.totalAmount || 0), 0);

  document.getElementById("bookingCount").textContent = all.length;
  document.getElementById("bookingTabCount").textContent = all.length;
  document.getElementById("pendingCount").textContent = pending;
  document.getElementById("revenueTotal").textContent = "₹" + value.toLocaleString("en-IN");
}

function filtered() {
  const q = searchBox.value.trim().toLowerCase();
  const st = statusFilter.value;
  return all.filter(b => {
    const status = b.status || "pending";
    if (st !== "all" && status !== st) return false;
    if (!q) return true;
    return [b.fullName, b.email, b.phone, b.trekName].some(v => String(v || "").toLowerCase().includes(q));
  });
}

function render() {
  updateStats();
  const list = filtered();
  resultNote.textContent = all.length ? `Showing ${list.length} of ${all.length} bookings` : "";

  if (!all.length) {
    container.innerHTML = `<div class="empty">📭<h3>No bookings yet</h3><p>New bookings will appear here.</p></div>`;
  } else if (!list.length) {
    container.innerHTML = `<div class="empty">🔍<h3>No matching bookings</h3><p>Try a different search or status.</p></div>`;
  } else {
    container.innerHTML = list.map(renderBooking).join("");
  }
}

// This updateDoc call moves the customer's tracker forward
container.addEventListener("click", async (e) => {
  const btn = e.target.closest(".save-btn");
  if (!btn) return;

  const card = btn.closest(".booking-admin-card");
  const bookingId = card.dataset.id;

  btn.disabled = true;
  btn.textContent = "Saving...";

  try {
    await updateDoc(doc(db, "bookings", bookingId), {
  status: card.querySelector(".f-status").value,
  busNumber: card.querySelector(".f-bus").value.trim(),
  pickupPoint: card.querySelector(".f-point").value.trim(),
  pickupTime: card.querySelector(".f-time").value.trim()
});
    window.showToast("Booking updated. The customer sees it now.");
  } catch (err) {
    console.error(err);
    window.showToast("Could not update: " + (err.code || err.message), true);
  } finally {
    btn.disabled = false;
    btn.textContent = "Update";
  }
});

// While the admin is typing in a card, don't redraw; redraw once they leave it
container.addEventListener("focusout", () => {
  setTimeout(() => { if (!container.contains(document.activeElement)) render(); }, 200);
});

searchBox.addEventListener("input", render);
statusFilter.addEventListener("change", render);

let started = false;

onAuthStateChanged(auth, (user) => {
  // Not logged in, or logged in as a normal user: send to the admin login page
  if (!user || !user.email || user.email.toLowerCase() !== ADMIN_EMAIL) {
    window.location.replace("admin-login.html");
    return;
  }

  // Verified admin: show the page and load the data (only once)
  document.body.classList.remove("locked");
  if (started) return;
  started = true;
  window.loadMessages();

  onSnapshot(collection(db, "bookings"), (snap) => {
    all = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    if (!container.contains(document.activeElement)) render(); else updateStats();
  }, (err) => {
    console.error(err);
    container.innerHTML = `<div class="error">❌ Could not load bookings (${esc(err.code || err.message)}).<br>
      Check that this account is allowed to read bookings in your Firestore rules.</div>`;
  });
});
</script>

</body>
